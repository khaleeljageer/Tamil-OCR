# Fetch only the OCR models from Git LFS, cached between runs.
#
# GitHub's free plan includes 1 GB/month of LFS bandwidth. A plain LFS checkout would
# also download the ~250 MB of old executables in release/ on every job, so this
# downloads just tessdata/*.traineddata (~21 MB) and caches them by content hash.
name: Fetch OCR models (Git LFS)
description: Download tessdata/*.traineddata from Git LFS, with caching
runs:
  using: composite
  steps:
    - name: Hash the LFS pointers of the models
      id: lfs
      shell: bash
      run: echo "key=lfs-models-$(git lfs ls-files --long --include='tessdata/*' | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: .git/lfs/objects
        key: ${{ steps.lfs.outputs.key }}
    - name: Check out the models
      shell: bash
      run: |
        git lfs pull --include="tessdata/*"
        ls -l tessdata
        # Fail early if a model is still an LFS pointer instead of the real file
        for f in tessdata/*.traineddata; do
          if head -c 100 "$f" | grep -q "^version https://git-lfs.github.com/spec/"; then
            echo "::error::$f was not downloaded from Git LFS"; exit 1
          fi
        done
