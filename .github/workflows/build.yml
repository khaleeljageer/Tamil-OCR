# Test, build and release Tamil OCR.
#
# - Every push to main and every pull request: run the tests and build the Linux and
#   Windows executables (downloadable from the run's "Artifacts" for 14 days).
# - Pushing a tag vX.Y.Z that points to a commit on main: the same, then publish a
#   GitHub Release with both executables. The tag must match APP_VERSION in main.py.
# - "Run workflow" (manual) with a tag: release the current main under that tag.
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create on main, e.g. v1.2.0 (must match APP_VERSION in main.py)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release; cancel superseded branch/PR runs
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}

env:
  PYTHON_VERSION: '3.11'

jobs:
  check:
    name: Check release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed to check that the tag is on main

      - name: Decide whether this run is a release
        id: check
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Manual releases must be run on the main branch (this run is on $GITHUB_REF)."
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::Tag $tag already exists. Push the tag instead, or choose a new version."
              exit 1
            fi
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Not a release run."
            exit 0
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$tag' must look like v1.2.3."
            exit 1
          fi

          app_version=$(sed -n 's/^APP_VERSION = "\(.*\)"$/\1/p' main.py)
          if [[ "v$app_version" != "$tag" ]]; then
            echo "::error::Tag $tag does not match APP_VERSION = \"$app_version\" in main.py. Update APP_VERSION first."
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $tag points to $GITHUB_SHA, which is not on the main branch. Merge to main and tag that commit."
            exit 1
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $GITHUB_SHA (on main)."

  test:
    name: Test (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      # Run the bundled Tesseract AppImage without needing FUSE on the runner
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lfs-models
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Install Python packages
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest

  build:
    name: Build (${{ matrix.os }})
    needs: [check, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build on the oldest supported Ubuntu so the binary runs on older distros too
          - os: ubuntu-22.04
            exe: dist/Tamil-OCR
            asset: Tamil-OCR_linux
          - os: windows-latest
            exe: dist/Tamil-OCR.exe
            asset: Tamil-OCR_windows.exe
    runs-on: ${{ matrix.os }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lfs-models
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Install Python packages
        run: pip install -r requirements-dev.txt
      - name: Build executable
        run: python build.py
      - name: Smoke-test the executable (open a PDF and run OCR)
        run: python .github/scripts/smoke_test.py ${{ matrix.exe }}
      - name: Rename for release
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.exe }}" "out/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish release
    needs: [check, build]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the tag (manual runs) and the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: |
          sha256sum Tamil-OCR_linux Tamil-OCR_windows.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --title "Tamil OCR $TAG" --generate-notes)
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            args+=(--target "$GITHUB_SHA")   # creates the tag on this main commit
          else
            args+=(--verify-tag)
          fi
          gh release create "$TAG" "${args[@]}" \
            assets/Tamil-OCR_linux assets/Tamil-OCR_windows.exe assets/SHA256SUMS.txt
